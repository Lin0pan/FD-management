name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A dummy value so `prisma validate` / `next build` can resolve env("DATABASE_URL").
# The real database is created per-job by `prisma migrate deploy` where needed.
env:
  DATABASE_URL: "file:../data/ci.db"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Validate Prisma schema
        run: npx prisma validate

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Unit tests with coverage (domain + application)
        run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Next.js production build
        run: npm run build

  # One leg per supported engine (ADR-012): DF run Safari today and a Chromium-based browser if the
  # machine is ever replaced, so both are gates rather than one being a courtesy. The legs are
  # independent jobs — each installs only its own browser and drives a register of its own
  # (tests/e2e/registers.ts), so neither can move the other's customer numbers.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Both results are wanted on a red run: "Safari broke" and "both broke" are different bugs.
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      DATABASE_URL: "file:../data/e2e.db"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build app
        run: npm run build
      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          FD_E2E_ENGINE: ${{ matrix.engine }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 7

  # The check `main`'s ruleset actually requires, and the reason this job exists at all.
  #
  # A matrix does not publish a check under its job name: it publishes one per leg, `e2e (chromium)`
  # and `e2e (webkit)`. So the moment `e2e-tests` became a matrix, the context the ruleset waits for
  # stopped being produced and every pull request blocked for good — not on a failure, but on a check
  # that could never report. This fans the legs back into the single name `main` asks for.
  #
  # Keep it. Adding a third engine then costs a line in the matrix and no change to branch
  # protection, which is the point: the required context must not depend on how many engines there
  # are.
  e2e-tests:
    needs: e2e
    # Without this the aggregate is skipped when a leg fails, and a skipped required check is not a
    # failing one — the ruleset would wait for ever instead of reporting red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every engine passed
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "At least one engine failed: e2e = ${{ needs.e2e.result }}"
          exit 1
